
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saylani SMIT Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <p class="signup-label">Sign up</p>

    <div class="login-container">

        <div class="login-panel">

            <div class="logo">
                <img src="smit-logo.png" alt="Saylani SMIT Logo">
            </div>

            <h2>Log into your Account</h2>

            <form>

                <div class="input-box">
                    <span class="input-icon">&#9993;</span>
                    <input type="email" placeholder="iamchis_wallace@email.com" required>
                </div>

                <div class="input-box">
                    <span class="input-icon">&#128274;</span>
                    <input type="password" placeholder="Password" required>
                    <span class="eye-icon">&#9673;</span>
                </div>

                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="signin-btn">Sign in</button>

                <div class="divider">
                    <span></span>
                    <p>or</p>
                    <span></span>
                </div>

                <div class="social-buttons">

                    <button type="button" class="social-btn">
                        <span class="google-icon">G</span>
                        Sign in with Google
                    </button>

                    <button type="button" class="social-btn">
                        <span class="facebook-icon">f</span>
                        Sign in with Facebook
                    </button>

                    <button type="button" class="social-btn">
                        <span class="apple-icon">&#63743;</span>
                        Sign in with Apple
                    </button>

                </div>

                <p class="create-account">
                    Don't have an account?
                    <a href="#">Create Account</a>
                </p>

            </form>

        </div>

        <div class="image-panel">
            <img src="study-desk.png" alt="Student studying at a desk">
        </div>

    </div>

</body>
</html>
